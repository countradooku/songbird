[package]
name = "nsh-app-songbird"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
nsh-core = "0.6.0"
nsh-base = "0.6.0"
env_logger = "0.11"
# Theme variants (light, dark, high contrast) are built from theme.json at run time.
serde_json = "1"
log = "0.4"
# The real backend (src/backend): the server's own crates, so wire formats
# can't drift. Not songbird-api (a service crate with database clients).
songbird-types = { path = "../../crates/types" }
songbird-proto = { path = "../../crates/proto" }
songbird-pow = { path = "../../crates/pow" }
songbird-keys = { path = "../../crates/keys" }
songbird-client = { path = "../../crates/client" }
aws-lc-rs = { version = "1.19.0", default-features = false, features = ["aws-lc-sys"] }
# The camera (D-0110): one interface over each platform's camera; all `unsafe` lives there.
songbird-camera = { path = "../camera" }
# Real QR codes (D-0110): the link code, invites, safety numbers. No `image`/`svg`: no deps.
qrcode = { version = "0.14.1", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
nsh-platform-linux = { version = "0.6.0", default-features = false, features = ["shader", "editor", "emoji-picker", "highlight", "math", "plot", "rich-editor", "term"] }

[target.'cfg(target_os = "macos")'.dependencies]
nsh-platform-macos = { version = "0.6.0", default-features = false, features = ["shader", "editor", "emoji-picker", "highlight", "math", "plot", "rich-editor", "term"] }

[target.'cfg(target_os = "windows")'.dependencies]
nsh-platform-windows = { version = "0.6.0", default-features = false, features = ["shader", "editor", "emoji-picker", "highlight", "math", "plot", "rich-editor", "term"] }

[dev-dependencies]
# The real engine, headless, for tests of the reactive wiring (NSH testing guide).
nsh-engine = { version = "0.6.0", default-features = false }
nsh-testing = { version = "0.6.0", default-features = false }
