# Development configuration for the delivery service. No secrets here, ever: secrets are
# referenced as { file = "..." } or { env = "..." } (see crates/types/src/secret.rs).
[common]
environment = "dev"
admin_listen = "127.0.0.1:9101"
shutdown_grace_secs = 5

[common.log]
format = "pretty"
filter = "info"

[delivery]
listen = "127.0.0.1:9201"
server_name = "localhost"
# No [delivery.directory] file: no device can authenticate. `songbird-loadgen keys` writes one.

# Mailbox store. `memory` (default) loses everything on restart. To use the docker compose
# SurrealDB (`cargo xtask compose up`), uncomment and point the secrets at files you create:
#
# [delivery.mailbox]
# backend = "surrealdb"
# [delivery.mailbox.surrealdb]
# addr = "127.0.0.1:47800"
# host = "localhost"
# user = "root"
# pass = { env = "SURREAL_PASS" }
# idempotency_secret = { file = "/path/to/idempotency-secret.hex" }   # 64 hex chars, mode 0600
