# A test environment on one existing server that already runs Coolify (its Traefik owns 80/443).
# Not `beta`: no mTLS, no host hardening, no backups, `environment = "dev"`. For trying the app on a
# phone against real services. Deployed by deploy/dev-vps/deploy.sh; layout in README.md there.
#
# Traefik reaches the public services over the `coolify` network (routes in traefik.yaml):
#   api.<domain>      HTTPS, terminated by Traefik            -> api:8443 (plain HTTP inside)
#   ws.<domain>:443   TLS passed through by SNI (D-0018)      -> delivery:9201 (delivery's own TLS)
#   livekit.<domain>  HTTPS/WSS, terminated by Traefik        -> livekit:7880
# LiveKit media and TURN are published directly: 7881/tcp, 7882/udp, 3478/udp, 5349/tcp.
# The stores have no published ports.
name: songbird

x-defaults: &defaults
  restart: unless-stopped
  networks: [songbird]
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "3" }

x-service: &service
  <<: *defaults
  user: "65532:65532"
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  env_file: [/opt/songbird/secrets/env]

services:
  surrealdb:
    <<: *defaults
    image: surrealdb/surrealdb:v4.0.1@sha256:408eb8e5c9436670525e2bc2634b1e50ba74ce1b447eaf0094c35f73b67f9cb6
    user: "0:0"
    command: ["start", "--bind", "0.0.0.0:8000", "--log", "info", "--log-format", "json", "surrealkv:///data/songbird.db?sync=every"]
    env_file: [/opt/songbird/secrets/env]
    volumes: [surrealdb:/data]
    healthcheck:
      test: ["CMD", "/surreal", "is-ready", "--endpoint", "http://127.0.0.1:8000"]
      interval: 5s
      retries: 30

  valkey-hot:
    <<: *defaults
    image: valkey/valkey:9.1.3-alpine3.24@sha256:bf09d58e96d6b4524a15396b65b242bbe18beebbcc15a04d8ee75ddac62fae0b
    command: ["sh", "-c", 'exec valkey-server --save "" --appendonly no --maxmemory 512mb --maxmemory-policy noeviction --requirepass "$$VALKEY_HOT_PASSWORD"']
    env_file: [/opt/songbird/secrets/env]
    healthcheck:
      test: ["CMD", "sh", "-c", 'REDISCLI_AUTH="$$VALKEY_HOT_PASSWORD" valkey-cli ping']
      interval: 5s
      retries: 30

  valkey-jobs:
    <<: *defaults
    image: valkey/valkey:9.1.3-alpine3.24@sha256:bf09d58e96d6b4524a15396b65b242bbe18beebbcc15a04d8ee75ddac62fae0b
    command: ["sh", "-c", 'exec valkey-server --appendonly yes --appendfsync everysec --maxmemory 512mb --maxmemory-policy noeviction --requirepass "$$VALKEY_JOBS_PASSWORD"']
    env_file: [/opt/songbird/secrets/env]
    volumes: [valkey-jobs:/data]
    healthcheck:
      test: ["CMD", "sh", "-c", 'REDISCLI_AUTH="$$VALKEY_JOBS_PASSWORD" valkey-cli ping']
      interval: 5s
      retries: 30

  rustfs:
    <<: *defaults
    image: rustfs/rustfs:1.0.5 # digest pending, see D-0035
    env_file: [/opt/songbird/secrets/env]
    environment:
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ENABLE: "false"
      RUSTFS_FTP_ENABLE: "false"
      RUSTFS_FTPS_ENABLE: "false"
      RUSTFS_SFTP_ENABLE: "false"
      RUSTFS_WEBDAV_ENABLE: "false"
      RUSTFS_CHECK_UPDATE: "false"
      RUSTFS_OBS_LOG_DIRECTORY: ""
    volumes: [rustfs:/data]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/health/ready"]
      interval: 5s
      retries: 30

  api:
    <<: *service
    image: songbird-api:dev
    container_name: songbird-api
    command: [--config, /etc/songbird/config.toml]
    networks: [songbird, coolify]
    volumes:
      - /opt/songbird/config/api.toml:/etc/songbird/config.toml:ro
      - /opt/songbird/secrets:/run/songbird:ro
    depends_on:
      surrealdb: { condition: service_healthy }
      valkey-hot: { condition: service_healthy }
      valkey-jobs: { condition: service_healthy }
      rustfs: { condition: service_healthy }

  delivery:
    <<: *service
    image: songbird-delivery:dev
    container_name: songbird-delivery
    command: [--config, /etc/songbird/config.toml]
    networks: [songbird, coolify]
    volumes:
      - /opt/songbird/config/delivery.toml:/etc/songbird/config.toml:ro
      - /opt/songbird/secrets:/run/songbird:ro
      - /opt/songbird/tls/ws:/etc/songbird/tls:ro
    depends_on:
      surrealdb: { condition: service_healthy }

  calls:
    <<: *service
    image: songbird-calls:dev
    container_name: songbird-calls
    command: [--config, /etc/songbird/config.toml]
    volumes:
      - /opt/songbird/config/calls.toml:/etc/songbird/config.toml:ro
      - /opt/songbird/secrets:/run/songbird:ro
    depends_on:
      valkey-hot: { condition: service_healthy }

  livekit:
    <<: *defaults
    image: livekit/livekit-server:v1.13.11@sha256:25cd902de7cacbd5f1f779f6a6ac1eae20ba8f56b0935934ce6b0ab80d1e3d20
    container_name: songbird-livekit
    command: ["--config", "/etc/livekit.yaml"]
    env_file: [/opt/songbird/secrets/livekit.env]
    networks: [songbird, coolify]
    volumes:
      - /opt/songbird/config/livekit.yaml:/etc/livekit.yaml:ro
      - /opt/songbird/tls/turn:/tls/turn:ro
    ports:
      - "7881:7881/tcp"
      - "7882:7882/udp"
      - "3478:3478/udp"
      - "5349:5349/tcp"
    security_opt: ["no-new-privileges:true"]

  # One-off: `docker compose run --rm admin invites create …` (deploy.sh invite).
  admin:
    <<: *service
    image: songbird-admin:dev
    restart: "no"
    read_only: false
    profiles: [tools]
    entrypoint: ["/app"]
    volumes:
      - /opt/songbird/admin:/var/lib/songbird-admin

networks:
  songbird: {}
  coolify:
    external: true

volumes:
  surrealdb: {}
  valkey-jobs: {}
  rustfs: {}
