[defaults]
inventory = inventory/generated
roles_path = roles
collections_path = .collections
interpreter_python = auto_silent
forks = 20
nocows = true
# Secrets are loaded from SOPS; never print task arguments that might contain them.
display_args_to_stdout = false

[ssh_connection]
pipelining = true
# accept-new: trust a host key on first contact (fresh servers), refuse a changed one afterwards.
ssh_args = -o StrictHostKeyChecking=accept-new -o ControlMaster=auto -o ControlPersist=60s
