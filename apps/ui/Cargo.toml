[package]
name = "nsh-app-songbird"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
nsh-core = { git = "https://github.com/longbridge/nsh", rev = "00cfb08ec7c337c71e47e04034a5e5962bc0a871" }
nsh-base = { git = "https://github.com/longbridge/nsh", rev = "00cfb08ec7c337c71e47e04034a5e5962bc0a871" }
env_logger = "0.11"
# Theme variants (light, dark, high contrast) are built from theme.json at run time.
serde_json = "1"
log = "0.4"
# The real backend (src/backend): the server's own crates, so wire formats
# can't drift. Not songbird-api (a service crate with database clients).
songbird-types = { path = "../../crates/types" }
songbird-proto = { path = "../../crates/proto" }
songbird-pow = { path = "../../crates/pow" }
songbird-keys = { path = "../../crates/keys" }
songbird-client = { path = "../../crates/client" }
aws-lc-rs = { version = "1.19.0", default-features = false, features = ["aws-lc-sys"] }

[target.'cfg(target_os = "linux")'.dependencies]
nsh-platform-linux = { git = "https://github.com/longbridge/nsh", rev = "00cfb08ec7c337c71e47e04034a5e5962bc0a871", default-features = false, features = ["shader", "editor", "emoji-picker", "highlight", "math", "plot", "rich-editor", "term"] }

[target.'cfg(target_os = "macos")'.dependencies]
nsh-platform-macos = { git = "https://github.com/longbridge/nsh", rev = "00cfb08ec7c337c71e47e04034a5e5962bc0a871", default-features = false, features = ["shader", "editor", "emoji-picker", "highlight", "math", "plot", "rich-editor", "term"] }

[target.'cfg(target_os = "windows")'.dependencies]
nsh-platform-windows = { git = "https://github.com/longbridge/nsh", rev = "00cfb08ec7c337c71e47e04034a5e5962bc0a871", default-features = false, features = ["shader", "editor", "emoji-picker", "highlight", "math", "plot", "rich-editor", "term"] }
