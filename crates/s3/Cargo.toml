[package]
name = "songbird-s3"
description = "Minimal S3 client for RustFS: AWS Signature V4 with aws-lc-rs over hyper's HTTP/1 client connection API, path-style URLs, bounded responses. Replaces the AWS SDK's dependency tree (D-0036)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
songbird-types.workspace = true
aws-lc-rs.workspace = true
bytes.workspace = true
futures-core.workspace = true
hex.workspace = true
# The workspace enables only `http1` and `server`; this crate adds the client connection API
# (`want`, `pin-project-lite`, `smallvec`: already in the lock file).
hyper = { workspace = true, features = ["client"] }
hyper-util.workspace = true
rustls.workspace = true
rustls-pki-types.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["net", "rt", "sync", "time"] }
tokio-rustls.workspace = true
zeroize.workspace = true

[dev-dependencies]
proptest.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "io-util"] }

[lints]
workspace = true
