---
- name: Set the hostname
  ansible.builtin.hostname:
    name: "{{ inventory_hostname }}"

- name: Resolve every host's internal name to its private address
  ansible.builtin.blockinfile:
    path: /etc/hosts
    marker: "# {mark} songbird internal names"
    block: |
      {% for h in groups['all'] %}
      {{ hostvars[h].private_ip }} {{ hostvars[h].fqdn }} {{ h }}
      {% endfor %}

- name: Upgrade packages
  ansible.builtin.apt:
    update_cache: true
    upgrade: dist
    cache_valid_time: 3600

- name: Install base packages
  ansible.builtin.apt:
    name: [unattended-upgrades, chrony, nftables, ca-certificates, python3-requests]
    state: present

- name: Automatic security updates (no automatic reboot; reboots are scheduled drains)
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/52songbird-unattended
    mode: "0644"
    content: |
      Unattended-Upgrade::Origins-Pattern { "origin=Debian,codename=${distro_codename}-security"; };
      Unattended-Upgrade::Automatic-Reboot "false";
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";

- name: Kernel and network settings
  ansible.posix.sysctl:
    name: "{{ item.key }}"
    value: "{{ item.value }}"
    sysctl_file: /etc/sysctl.d/60-songbird.conf
    reload: true
  loop: "{{ sysctls | dict2items }}"

- name: Open-file limits for services
  ansible.builtin.copy:
    dest: /etc/systemd/system.conf.d/60-songbird.conf
    mode: "0644"
    content: |
      [Manager]
      DefaultLimitNOFILE={{ open_files_limit }}
  notify: Reload systemd

- name: Bounded journald retention (logs carry no personal data, invariant 6, but stay bounded)
  ansible.builtin.copy:
    dest: /etc/systemd/journald.conf.d/60-songbird.conf
    mode: "0644"
    content: |
      [Journal]
      Storage=persistent
      SystemMaxUse=2G
      MaxRetentionSec=14day
  notify: Restart journald

- name: Songbird directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0750"
  loop: [/etc/songbird, /var/lib/songbird, "{{ songbird_pki_dir }}"]
