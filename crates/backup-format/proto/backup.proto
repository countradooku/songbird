// Songbird backup format, version 1 (PROTOCOL §11; D-0119 and D-0120).
//
// This file is the specification; `src/schema.rs` mirrors it field for field (prost) and the
// vectors in `vectors/` prove the encodings. Rules (as content, PROTOCOL §5.2):
// - readers ignore unknown fields and enum values;
// - fields are never renumbered or reused; a field a newer writer adds must be safe to ignore,
//   or the writer raises `min_reader_version`;
// - integers are fixed meanings in UTC milliseconds and bytes; nothing depends on the platform
//   (no paths, no locale, no native integer width).
syntax = "proto3";
package songbird.backup.v1;

// The manifest's plaintext (inside the encrypted manifest object, §11.4).
message Manifest {
  uint32 format_version = 1;      // the writer's format version
  uint32 min_reader_version = 2;  // readers older than this refuse the backup
  uint64 created_ms = 3;
  string app_version = 4;         // informational
  Platform platform = 5;          // informational; never changes how a backup is read
  bytes previous = 6;             // SHA-256 of the previous manifest object; empty for the first
  repeated Stream streams = 7;
}

enum Platform {
  PLATFORM_UNKNOWN = 0;
  PLATFORM_IOS = 1;
  PLATFORM_ANDROID = 2;
  PLATFORM_MACOS = 3;
  PLATFORM_WINDOWS = 4;
  PLATFORM_LINUX = 5;
}

enum StreamKind {
  STREAM_UNKNOWN = 0;
  STREAM_RECORDS = 1;      // length-delimited `Record`s, in the order of §11.5
  STREAM_SMALL_MEDIA = 2;  // length-delimited `Blob`s (media under 1 MiB)
  STREAM_MEDIA = 3;        // one media file's bytes; `id` is its media reference
}

// One byte stream, cut into chunks.
message Stream {
  StreamKind kind = 1;
  bytes id = 2;                 // empty, or the media reference of a STREAM_MEDIA
  uint64 length = 3;            // bytes in the stream
  bytes sha256 = 4;             // SHA-256 of the stream's bytes
  repeated ChunkRef chunks = 5; // in order
}

message ChunkRef {
  bytes name = 1;    // 32 bytes: HMAC-SHA256(chunk-name key, plaintext)
  uint32 length = 2; // plaintext bytes
}

// One item of the records stream. Exactly one body.
message Record {
  oneof body {
    Account account = 1;
    Profile profile = 2;
    Setting setting = 3;
    Contact contact = 4;
    Group group = 5;
    Chat chat = 6;
    Message message = 7;
    Media media = 8;
  }
}

// The account: what makes a restored device the same account (safety numbers kept).
message Account {
  bytes account_id = 1;         // 16 bytes
  bytes identity_seed = 2;      // 32 bytes: the account identity key's Ed25519 seed
  bytes profile_key = 3;        // 32 bytes
  bytes storage_key = 4;        // 32 bytes: the record store's key (§10.1)
  bytes access_key = 5;         // 16 bytes: the sealed-sender access key
  string username = 6;          // the claimed username, if any
  bytes username_key = 7;       // the username key, if any
  uint64 device_list_version = 8;
  string server_name = 9;
}

message Profile {
  string name = 1;
  string about = 2;
  string status_text = 3;
  string status_emoji = 4;
  uint64 status_expires_ms = 5;
  bytes avatar = 6;  // a media reference, or empty
  uint64 profile_version = 7;
}

// A setting: a logical record key (§10.2) and its value as the record store holds it, or a
// device-only setting under the `d/` prefix.
message Setting {
  string key = 1;
  bytes value = 2;
}

message Contact {
  bytes contact_id = 1;  // 16 bytes
  bytes account_id = 2;  // 16 bytes, or empty
  string name = 3;
  string notes = 4;
  repeated string buddy_groups = 5;
  bytes identity_key = 6;  // the contact's verified account identity key, if verified
  bool verified = 7;
}

// Enough to rejoin a group (§6): never its MLS secrets.
message Group {
  bytes group_id = 1;       // 16 bytes
  string name = 2;
  bytes metadata_key = 3;   // the members' shared metadata key
  repeated bytes members = 4;  // account IDs
  uint32 role = 5;
  bool channel = 6;
}

message Chat {
  bytes chat_id = 1;     // a peer's account ID (16 bytes) or a group ID
  ChatKind kind = 2;
  string title = 3;
  uint64 created_ms = 4;
  uint64 read_up_to_ms = 5;
  bool archived = 6;
  bool pinned = 7;
  uint64 muted_until_ms = 8;
  uint32 timer_s = 9;
}

enum ChatKind {
  CHAT_UNKNOWN = 0;
  CHAT_DIRECT = 1;
  CHAT_GROUP = 2;
  CHAT_CHANNEL = 3;
  CHAT_NOTE_TO_SELF = 4;
}

message Message {
  bytes chat_id = 1;
  bytes message_id = 2;   // as in the content (§5)
  bytes sender = 3;       // account ID; empty for this account
  uint64 sent_ms = 4;
  uint64 received_ms = 5;
  bytes content = 6;      // the `Content` protobuf of §5, as received or sent
  repeated bytes media = 7;  // media references, in the content's attachment order
  MessageStatus status = 8;
  bool starred = 9;
}

enum MessageStatus {
  STATUS_UNKNOWN = 0;
  STATUS_SENT = 1;
  STATUS_DELIVERED = 2;
  STATUS_READ = 3;
  STATUS_FAILED = 4;
  STATUS_RECEIVED = 5;
}

// A media file's metadata. Its bytes are a `Blob` in the small-media stream (under 1 MiB) or a
// STREAM_MEDIA with this reference as its ID.
message Media {
  bytes ref = 1;  // 32 bytes: HMAC-SHA256(chunk-name key, "songbird.v1/backup-media\0" || bytes)
                  // for small files; for streamed ones, of the stream's chunk names (§11.5)
  uint64 length = 2;
  string mime = 3;
  string file_name = 4;
  uint32 width = 5;
  uint32 height = 6;
  uint32 duration_ms = 7;
}

message Blob {
  bytes ref = 1;
  bytes data = 2;
}
