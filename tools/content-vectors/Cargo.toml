# Checks Songbird's content vectors against crates/content/proto/content.proto with an
# independent protobuf compiler (protox) and dynamic messages (prost-reflect), D-0059. NOT part of
# the workspace or of any build; run by hand (README.md), as for the libsignal and OpenMLS tools.
[package]
name = "content-vectors"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
protox = "=0.10.0"
prost-reflect = { version = "=0.16.5", features = ["serde"] }
prost = "0.14"
serde_json = "1"
hex = "0.4"
base64 = "0.22"

[workspace]
