# Shared variables. Image digests match deploy/compose/compose.yaml (docs/DECISIONS.md D-0007).
songbird_registry: "ghcr.io/songbirdchat"
songbird_version: "{{ lookup('ansible.builtin.env', 'SONGBIRD_VERSION') | default('0.1.0', true) }}"
songbird_secrets_file: "{{ playbook_dir }}/../secrets/{{ songbird_env }}.sops.yaml"
songbird_pki_dir: "/etc/songbird/tls"

images:
  surrealdb: "surrealdb/surrealdb:v4.0.1@sha256:408eb8e5c9436670525e2bc2634b1e50ba74ce1b447eaf0094c35f73b67f9cb6"
  valkey: "valkey/valkey:9.1.3-alpine3.24@sha256:bf09d58e96d6b4524a15396b65b242bbe18beebbcc15a04d8ee75ddac62fae0b"
  rustfs: "rustfs/rustfs:1.0.5" # digest pending, see D-0035
  livekit: "livekit/livekit-server:v1.13.11@sha256:25cd902de7cacbd5f1f779f6a6ac1eae20ba8f56b0935934ce6b0ab80d1e3d20"
  iggy: "apache/iggy:0.10.0@sha256:176125a0580f526b0fee8b98ccf4ed5f77e243066183243d87282abce4851bf3"
  ghostunnel: "ghostunnel/ghostunnel:v1.11.5@sha256:65c4e34ec0ee0f30ea1f72b7411ec70a91c32fc50f067a8466ad2adb1e7420f2"
  # Monitoring on the bastion (Prompt 8, D-0097).
  prometheus: "prom/prometheus:v3.5.0@sha256:63805ebb8d2b3920190daf1cb14a60871b16fd38bed42b857a3182bc621f4996"
  alertmanager: "prom/alertmanager:v0.28.1@sha256:27c475db5fb156cab31d5c18a4251ac7ed567746a2483ff264516437a39b15ba"

# Push (Prompt 8, D-0097): which providers this environment uses, the app's bundle ID and the
# VAPID contact. Their credentials are in SOPS and reach the push container only
# (roles/songbird/tasks/push.yml; `cargo xtask secret-scope` checks it).
push_providers:
  apns: true
  fcm: true
  webpush: true
push_bundle_id: chat.songbird.app
# Push runs as a uid of its own (D-0100): the provider keys on the host are readable by push alone,
# not by every Songbird container's uid.
push_uid: 65533
push_vapid_subject: "mailto:push@{{ songbird_public_domain | default('songbird.chat') }}"

# Which Songbird services run on which role, and their private admin ports.
songbird_services_by_role:
  edge: [delivery, api]
  worker: [push, worker]
  calls: [calls]
songbird_admin_ports:
  delivery: 9101
  api: 9102
  push: 9103
  worker: 9104
  calls: 9105

# Internal (private network only) ports by role, opened in nftables from private_cidr only.
internal_ports_by_role:
  data: [8000, 8090, 6379, 6380, 9010]
  # LiveKit's tunnel (7880) and Valkey (6381) are opened per source host in nftables (D-0091).
  calls: []
  edge: [9101, 9102]
  worker: [9103, 9104]
  calls_admin: [9105]

# Kernel and system settings (Prompt 2a section 4). Benchmarks may change them; record why.
sysctls:
  fs.file-max: 4194304
  fs.nr_open: 4194304
  net.core.somaxconn: 65535
  net.core.netdev_max_backlog: 65535
  net.ipv4.tcp_max_syn_backlog: 65535
  net.ipv4.ip_local_port_range: "10240 65535"
  net.ipv4.tcp_syncookies: 1
  net.ipv4.conf.all.rp_filter: 1
  net.ipv4.conf.all.accept_redirects: 0
  net.ipv4.conf.all.send_redirects: 0
  net.ipv6.conf.all.accept_redirects: 0
  vm.overcommit_memory: 1
  kernel.kptr_restrict: 2
  kernel.dmesg_restrict: 1
open_files_limit: 1048576

# Mutual TLS: one leaf certificate per component per host, issued by the internal intermediate CA
# (tools/admin, `songbird-admin ca`). Files are owned by the uid the component runs as.
tls_components_by_role:
  data: [surrealdb, iggy, valkey-hot, valkey-jobs, rustfs]
  edge: [delivery, api]
  worker: [push, worker]
  calls: [calls, livekit, valkey-livekit]
tls_owner_uid:
  surrealdb: 65532
  iggy: 0
  valkey-hot: 999
  valkey-jobs: 999
  rustfs: 65532 # read by the ghostunnel in front of RustFS
  livekit: 0
  valkey-livekit: 999
  delivery: 65532
  api: 65532
  push: 65533
  worker: 65532
  calls: 65532
tls_leaf_days: 30
tls_renew_within_days: 10

# Iggy (mailbox log, D-0029): shard threads and buffer pool on the shared beta data host.
iggy_cpu_allocation: "2"
iggy_memory_pool: "1 GiB"

valkey_hot_maxmemory: 2gb
valkey_jobs_maxmemory: 2gb
admin_cidrs: "{{ (lookup('community.sops.sops', songbird_secrets_file) | from_yaml).admin_cidrs_json | from_json }}"

# Off-site registry backups (D-0040; bucket, keys and age recipients per environment in SOPS:
# backup_s3_bucket, backup_s3_access_key, backup_s3_secret_key, backup_surreal_password,
# backup_age_recipients). The bucket and its keys come from deploy/bin/backups-up.
# Hetzner Object Storage in Helsinki: another location than the servers (D-0042).
backup_s3_endpoint: "hel1.your-objectstorage.com:443"
backup_s3_region: hel1

# Calls (Prompt 7, D-0085, D-0089). The public names are the owner's (D-0046); TURN/TLS needs a
# certificate for turn_domain in /etc/songbird/public-tls/turn, signalling one for calls_domain in
# /etc/songbird/public-tls/calls.
calls_domain: "calls.{{ songbird_public_domain | default('songbird.chat') }}"
turn_domain: "turn.{{ songbird_public_domain | default('songbird.chat') }}"
livekit_valkey_port: 6381
livekit_webhook_port: 9106
livekit_turn_relay_range: [30000, 40000]
livekit_valkey_maxmemory: 512mb
