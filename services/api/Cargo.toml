[package]
name = "songbird-api"
description = "Songbird api service: registration and invites, push registration, attachment uploads and downloads, account deletion, sends without a socket; signed device requests (D-0036, D-0048)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "songbird-api"
path = "src/main.rs"

[dependencies]
songbird-service.workspace = true
songbird-types.workspace = true
songbird-accounts.workspace = true
songbird-entitlements.workspace = true
songbird-jobs.workspace = true
songbird-valkey.workspace = true
songbird-s3.workspace = true
songbird-link.workspace = true
songbird-send.workspace = true
songbird-proto.workspace = true
songbird-mailbox.workspace = true
songbird-router.workspace = true
songbird-pow.workspace = true
songbird-keys.workspace = true
songbird-akd.workspace = true
songbird-groups.workspace = true
songbird-calls.workspace = true
postcard.workspace = true
akd.workspace = true
getrandom.workspace = true
argon2.workspace = true
zeroize.workspace = true
aws-lc-rs.workspace = true
bytes.workspace = true
futures-core.workspace = true
hex.workspace = true
http-body-util.workspace = true
hyper = { workspace = true, features = ["server", "client", "http1"] }
hyper-util = { workspace = true, features = ["server", "http1", "tokio"] }
mimalloc.workspace = true
redis.workspace = true
rustls.workspace = true
rustls-pki-types.workspace = true
# The GIF proxy's TLS trust anchors (Prompt 6, D-0083), as push uses them.
webpki-roots.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "net", "macros", "time", "sync"] }
tokio-rustls.workspace = true
tracing.workspace = true


[dev-dependencies]
songbird-surreal.workspace = true
# The client side of the record store, run against the real server (Prompt 9, M1).
songbird-sync.workspace = true

[lints]
workspace = true
