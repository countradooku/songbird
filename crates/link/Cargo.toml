[package]
name = "songbird-link"
description = "Node links: framed, multiplexed request/response between delivery nodes over TCP with mutual TLS (internal CA), peers restricted to an identity prefix (D-0034)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
bytes.workspace = true
rustls.workspace = true
rustls-pki-types.workspace = true
rustls-webpki = { version = "0.103.16", default-features = false, features = ["std"] }
tokio = { workspace = true, features = ["rt", "net", "io-util", "sync", "time", "macros"] }
tokio-rustls.workspace = true
thiserror.workspace = true
tracing.workspace = true

[dev-dependencies]
rcgen.workspace = true
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "net", "io-util", "sync", "time", "macros"] }

[lints]
workspace = true
