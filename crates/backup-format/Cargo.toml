[package]
name = "songbird-backup-format"
description = "Songbird's backup format (Prompt 10, D-0119; PROTOCOL §11): a 64-character recovery key, keys derived from it, a keyed content-defined chunker, XChaCha20-Poly1305 chunks under keyed names, an encrypted versioned manifest, and a two-phase reader that verifies every chunk before anything is restored. Sans-IO; shared by every app and never linked by a service."
