# Development configuration for the worker service. No secrets here, ever: secrets are
# referenced as { file = "..." } or { env = "..." } (see crates/types/src/secret.rs).
[common]
environment = "dev"
admin_listen = "127.0.0.1:9104"
shutdown_grace_secs = 5

[common.log]
format = "pretty"
filter = "info"

# Without [worker] the service idles (development smoke test). To run jobs against the docker
# compose stores, uncomment, create the files (mode 0600) and an internal-CA certificate for
# worker.<host>.songbird.internal (cargo xtask dev-env makes the CA):
#
# [worker]
# push_index_secret = { file = "/path/to/push-index-secret.hex" }
# propagation_ms = 3000   # at least delivery's registry poll interval, with a margin
# sweep_secs = 60
# [worker.surrealdb]
# addr = "127.0.0.1:47800"
# host = "localhost"
# user = "root"
# pass = { env = "SURREAL_PASS" }
# [worker.jobs]
# secret = { file = "/path/to/jobs-secret.hex" }
# [worker.jobs.valkey]
# addr = "127.0.0.1:47380"
# pass = { env = "VALKEY_JOBS_PASSWORD" }
# [worker.s3]
# addr = "127.0.0.1:47900"
# bucket = "songbird-attachments"
# access_key = { env = "RUSTFS_ACCESS_KEY" }
# secret_key = { env = "RUSTFS_SECRET_KEY" }
# [worker.delivery]
# node_name = "worker.dev.songbird.internal"
# cert_chain = "/path/to/worker.pem"
# key = { file = "/path/to/worker.key" }
# ca = "/path/to/ca.pem"
# nodes = [{ addr = "127.0.0.1:47950", name = "delivery.dev.songbird.internal" }]
# Deletion journal (D-0041): required in staging and production, over TLS. In development a
# locked RustFS bucket can stand in for the off-site backup bucket.
# [worker.deletion_journal]
# addr = "127.0.0.1:47900"        # production: "hel1.your-objectstorage.com:443"
# bucket = "songbird-backups-dev" # created with Object Lock
# tls = false                     # production: true (the default)
# access_key = { env = "RUSTFS_ACCESS_KEY" }
# secret_key = { env = "RUSTFS_SECRET_KEY" }
# key = { file = "/path/to/deletion-journal-key.hex" }
