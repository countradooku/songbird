[package]
name = "songbird-push"
description = "Songbird push service: consumes push jobs, opens the device's sealed registration and sends one constant wake-up through APNs, FCM or Web Push; the only holder of push credentials (D-0036)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "songbird-push"
path = "src/main.rs"

[dependencies]
songbird-service.workspace = true
songbird-types.workspace = true
songbird-accounts.workspace = true
songbird-jobs.workspace = true
songbird-valkey.workspace = true
songbird-surreal.workspace = true
songbird-push-providers.workspace = true
aws-lc-rs.workspace = true
hex.workspace = true
mimalloc.workspace = true
prometheus-client.workspace = true
redis.workspace = true
serde.workspace = true
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "time", "sync"] }
tracing.workspace = true
zeroize.workspace = true

[dev-dependencies]
songbird-push-providers = { workspace = true, features = ["test-support"] }
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "time", "sync", "test-util"] }

[lints]
workspace = true
