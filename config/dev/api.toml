# Development configuration for the api service. No secrets here, ever: secrets are
# referenced as { file = "..." } or { env = "..." } (see crates/types/src/secret.rs).
[common]
environment = "dev"
admin_listen = "127.0.0.1:9102"
shutdown_grace_secs = 5

[common.log]
format = "pretty"
filter = "info"

# Without [api] the service idles (development smoke test). To serve against the docker compose
# stores, uncomment and point the secrets at files you create (mode 0600):
#
# [api]
# listen = "127.0.0.1:8443"
# server_name = "api.localhost"
# push_public_key = "<64 hex: the push service's X25519 public key>"
# push_index_secret = { file = "/path/to/push-index-secret.hex" } # shared with push and worker
# [api.surrealdb]
# addr = "127.0.0.1:47800"
# host = "localhost"
# user = "root"
# pass = { env = "SURREAL_PASS" }
# [api.valkey_hot]
# addr = "127.0.0.1:47379"
# pass = { env = "VALKEY_HOT_PASSWORD" }
# [api.jobs]
# secret = { file = "/path/to/jobs-secret.hex" }                  # shared with delivery, push, worker
# [api.jobs.valkey]
# addr = "127.0.0.1:47380"
# pass = { env = "VALKEY_JOBS_PASSWORD" }
# [api.s3]
# addr = "127.0.0.1:47900"
# bucket = "songbird-attachments"
# access_key = { env = "RUSTFS_ACCESS_KEY" }
# secret_key = { env = "RUSTFS_SECRET_KEY" }
#
# PUT /v1/messages (D-0037, D-0044): needs the delivery nodes in cluster mode with
# `senders = ["api."]` in [delivery.cluster]; the values marked "as delivery" must match theirs.
# [api.send]
# stream = "songbird"                                            # as delivery's mailbox.iggy.stream
# topic = "mailbox"                                              # as delivery's mailbox.iggy.topic
# partitions = 12                                                # as delivery's mailbox.iggy.partitions
# idempotency_secret = { file = "/path/to/idempotency-secret.hex" } # as delivery's mailbox.iggy
# cluster_secret = { file = "/path/to/cluster-secret.hex" }      # as delivery's router.valkey
# node_name = "api.local.songbird.internal"                      # this service's link certificate
# cert_chain = "/path/to/api.crt"
# key = { file = "/path/to/api.key" }
# ca = "/path/to/ca.crt"
# [api.send.valkey]                                              # the router's Valkey (leases too)
# addr = "127.0.0.1:47379"
# pass = { env = "VALKEY_HOT_PASSWORD" }
#
# Registration and invites (Prompt 3, D-0048). Absent: those endpoints answer 503 and accounts are
# created only through the admin link. Every api node needs the same secret.
# [api.registration]
# secret = { file = "/path/to/registration-secret.hex" }         # 64 hex; same on every api node
# invite_only = true                                             # the launch default (D-0038)
# allowance = 5                                                  # invites per new account
# [api.registration.pow]                                         # measured defaults (D-0048)
# memory_kib = 16384
# iterations = 1
# bits = 4
# solutions = 8
#
# Usernames (Prompt 3, M2, D-0049). Absent: those endpoints answer 503.
# [api.usernames]
# secret = { file = "/path/to/usernames-secret.hex" }            # 64 hex; same on every api node
# reserved = ["songbird_ops"]                                     # beyond the built-in list
