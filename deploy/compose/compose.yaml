# Local development and CI integration environment.
#
#   cargo xtask compose up     # generates .env (random local secrets), starts, waits for health
#   cargo xtask compose down   # stops and deletes volumes
#
# Every image is pinned by digest; versions and digests are recorded in docs/DECISIONS.md (D-0007).
# Ports are published on 127.0.0.1 only, on non-default host ports (override with SB_PORT_*) so they
# do not collide with services already running on a developer machine. Secrets come from .env.
name: songbird

x-defaults: &defaults
  restart: unless-stopped
  networks: [songbird]
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "3" }

services:
  surrealdb:
    <<: *defaults
    image: surrealdb/surrealdb:v4.0.1@sha256:408eb8e5c9436670525e2bc2634b1e50ba74ce1b447eaf0094c35f73b67f9cb6
    user: "0:0" # named volume is root-owned; production runs it as a dedicated user (deploy/ansible)
    # SurrealKV with an fsync on every commit: the mailbox acknowledges a send only after its
    # commit, so this is invariant 1 (D-0027). v4.0.1 opens `rocksdb:` paths as SurrealKV anyway.
    command: ["start", "--bind", "0.0.0.0:8000", "--log", "info", "--log-format", "json", "surrealkv:///data/songbird.db?sync=every"]
    environment:
      SURREAL_USER: ${SURREAL_USER:?run cargo xtask dev-env}
      SURREAL_PASS: ${SURREAL_PASS:?run cargo xtask dev-env}
    volumes: [surrealdb:/data]
    ports: ["127.0.0.1:${SB_PORT_SURREALDB:-47800}:8000"]
    healthcheck:
      test: ["CMD", "/surreal", "is-ready", "--endpoint", "http://127.0.0.1:8000"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s

  # Mailbox log (D-0029). Topic durability `persisted` is set by the mailbox when it creates the
  # topic: Iggy fsyncs before it confirms an append (invariant 1). Iggy 0.10 runs on io_uring,
  # which the default container seccomp profile blocks; iggy-seccomp.json is Docker's default
  # profile (moby/profiles seccomp/v0.1.0) plus the three io_uring syscalls, nothing else.
  # It listens on the same port inside and outside the container so the address it advertises is
  # the one clients dial.
  iggy:
    <<: *defaults
    image: apache/iggy:0.10.0@sha256:176125a0580f526b0fee8b98ccf4ed5f77e243066183243d87282abce4851bf3
    security_opt: ["seccomp=./iggy-seccomp.json", "no-new-privileges:true"]
    environment:
      IGGY_PATH: /data
      IGGY_TCP_ADDRESS: "0.0.0.0:${SB_PORT_IGGY:-47890}"
      IGGY_NODE_ADVERTISED_ADDRESS: 127.0.0.1
      IGGY_HTTP_ENABLED: "false"
      IGGY_QUIC_ENABLED: "false"
      IGGY_WEBSOCKET_ENABLED: "false"
      IGGY_SHARDING_CPU_ALLOCATION: "2"
      IGGY_MEMORY_POOL_SIZE: "512 MiB" # Iggy's minimum
      IGGY_ROOT_USERNAME: ${IGGY_ROOT_USERNAME:?run cargo xtask dev-env --force}
      IGGY_ROOT_PASSWORD: ${IGGY_ROOT_PASSWORD:?run cargo xtask dev-env --force}
    volumes: [iggy:/data]
    ports: ["127.0.0.1:${SB_PORT_IGGY:-47890}:${SB_PORT_IGGY:-47890}"]
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/${SB_PORT_IGGY:-47890}"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s

  # Volatile state: per-device pub/sub, registry, rate limits. No persistence by design.
  valkey-hot:
    <<: *defaults
    image: valkey/valkey:9.1.3-alpine3.24@sha256:bf09d58e96d6b4524a15396b65b242bbe18beebbcc15a04d8ee75ddac62fae0b
    command:
      - sh
      - -c
      - exec valkey-server --save "" --appendonly no --maxmemory 512mb --maxmemory-policy noeviction --requirepass "$$VALKEY_HOT_PASSWORD"
    environment:
      VALKEY_HOT_PASSWORD: ${VALKEY_HOT_PASSWORD:?run cargo xtask dev-env}
      REDISCLI_AUTH: ${VALKEY_HOT_PASSWORD}
    ports: ["127.0.0.1:${SB_PORT_VALKEY_HOT:-47379}:6379"]
    healthcheck:
      test: ["CMD", "valkey-cli", "--no-auth-warning", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Job queue (Valkey Streams). AOF everysec, never evicts.
  valkey-jobs:
    <<: *defaults
    image: valkey/valkey:9.1.3-alpine3.24@sha256:bf09d58e96d6b4524a15396b65b242bbe18beebbcc15a04d8ee75ddac62fae0b
    command:
      - sh
      - -c
      - exec valkey-server --appendonly yes --appendfsync everysec --maxmemory 512mb --maxmemory-policy noeviction --requirepass "$$VALKEY_JOBS_PASSWORD"
    environment:
      VALKEY_JOBS_PASSWORD: ${VALKEY_JOBS_PASSWORD:?run cargo xtask dev-env}
      REDISCLI_AUTH: ${VALKEY_JOBS_PASSWORD}
    volumes: [valkey-jobs:/data]
    ports: ["127.0.0.1:${SB_PORT_VALKEY_JOBS:-47380}:6379"]
    healthcheck:
      test: ["CMD", "valkey-cli", "--no-auth-warning", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  # S3-compatible object storage for encrypted attachments and backup vaults (D-0035): RustFS,
  # single node, single disk. Only the S3 API listens (the admin API shares its port); the web
  # console, FTP, FTPS, SFTP and WebDAV are off, and so is the update check that calls
  # version.rustfs.com. Logs go to stdout.
  rustfs:
    <<: *defaults
    image: rustfs/rustfs:1.0.5 # digest pending, see D-0035
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:?run cargo xtask dev-env}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:?run cargo xtask dev-env}
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ENABLE: "false"
      RUSTFS_FTP_ENABLE: "false"
      RUSTFS_FTPS_ENABLE: "false"
      RUSTFS_SFTP_ENABLE: "false"
      RUSTFS_WEBDAV_ENABLE: "false"
      RUSTFS_CHECK_UPDATE: "false"
      RUSTFS_OBS_LOG_DIRECTORY: ""
    volumes: [rustfs:/data]
    ports: ["127.0.0.1:${SB_PORT_RUSTFS:-47900}:9000"]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/health/ready"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 3s

  # Calls SFU. Single node, no TURN in development.
  livekit:
    <<: *defaults
    image: livekit/livekit-server:v1.13.11@sha256:25cd902de7cacbd5f1f779f6a6ac1eae20ba8f56b0935934ce6b0ab80d1e3d20
    command: ["--config", "/etc/livekit.yaml"]
    environment:
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY:?run cargo xtask dev-env}: ${LIVEKIT_API_SECRET:?run cargo xtask dev-env}"
    volumes: ["./livekit.yaml:/etc/livekit.yaml:ro"]
    ports:
      - "127.0.0.1:${SB_PORT_LIVEKIT:-47880}:7880"
      - "127.0.0.1:${SB_PORT_LIVEKIT_TCP:-47881}:7881"
      - "127.0.0.1:${SB_PORT_LIVEKIT_UDP:-47882}:7882/udp"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:7880/"]
      interval: 2s
      timeout: 3s
      retries: 30

networks:
  songbird: {}

volumes:
  surrealdb: {}
  iggy: {}
  valkey-jobs: {}
  rustfs: {}
