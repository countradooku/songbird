---
- name: Host firewall (second layer behind the provider firewall)
  ansible.builtin.template:
    src: nftables.conf.j2
    dest: /etc/nftables.conf
    mode: "0600"
    validate: nft -c -f %s
  notify: Reload nftables

- name: Enable nftables
  ansible.builtin.systemd_service:
    name: nftables
    enabled: true
    state: started
