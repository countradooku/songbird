[package]
name = "songbird-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4.12"
songbird-types = { path = "../crates/types" }
songbird-proxy = { path = "../services/proxy" }
songbird-proto = { path = "../crates/proto" }
bytes = "1"
serde = { version = "1", features = ["derive"] }

# Not part of the main workspace: fuzzing needs nightly and libFuzzer.
[workspace]

[[bin]]
name = "client_hello"
path = "fuzz_targets/client_hello.rs"
test = false
doc = false
bench = false

[[bin]]
name = "proxy_link"
path = "fuzz_targets/proxy_link.rs"
test = false
doc = false
bench = false

[[bin]]
name = "config_toml"
path = "fuzz_targets/config_toml.rs"
test = false
doc = false
bench = false

[[bin]]
name = "id_parse"
path = "fuzz_targets/id_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "proto_client_frame"
path = "fuzz_targets/proto_client_frame.rs"
test = false
doc = false
bench = false

[[bin]]
name = "proto_server_frame"
path = "fuzz_targets/proto_server_frame.rs"
test = false
doc = false
bench = false
