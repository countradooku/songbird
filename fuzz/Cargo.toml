[package]
name = "songbird-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4.12"
songbird-types = { path = "../crates/types" }
songbird-proxy = { path = "../services/proxy" }
songbird-proto = { path = "../crates/proto" }
songbird-surreal = { path = "../crates/surreal" }
songbird-mailbox = { path = "../crates/mailbox" }
songbird-pow = { path = "../crates/pow" }
songbird-keys = { path = "../crates/keys" }
songbird-akd = { path = "../crates/akd" }
songbird-content = { path = "../crates/content" }
songbird-api = { path = "../services/api" }
songbird-s3 = { path = "../crates/s3" }
songbird-groups = { path = "../crates/groups" }
songbird-calls = { path = "../services/calls" }
songbird-groups-harness = { path = "../tests/groups" }
songbird-send = { path = "../crates/send" }
songbird-sync = { path = "../crates/sync" }
# The backup format (Prompt 10, D-0120).
songbird-backup-format = { path = "../crates/backup-format" }
# Anonymous tokens (Prompt 11, D-0128).
songbird-tokens = { path = "../crates/tokens" }
songbird-billing = { path = "../services/billing" }
rustls-pki-types = "1"
serde_json = "1"
aws-lc-rs = { version = "1.19.0", default-features = false, features = ["aws-lc-sys"] }
# The app's camera (D-0110): QR decoding and the still metadata filter.
songbird-camera = { path = "../apps/camera" }
akd = { version = "=0.13.0", default-features = false, features = ["whatsapp_v1", "serde_serialization", "public_auditing"] }
bytes = "1"
prost = "0.14"
serde = { version = "1", features = ["derive"] }

# Not part of the main workspace: fuzzing needs nightly and libFuzzer.
[workspace]

[[bin]]
name = "client_hello"
path = "fuzz_targets/client_hello.rs"
test = false
doc = false
bench = false

