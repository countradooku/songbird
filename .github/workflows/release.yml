# Release: on a signed version tag (v*).
#  1. Reproducible build inside the pinned builder image, built twice and compared bit for bit.
#  2. SHA256SUMS signed with Sigstore (keyless, GitHub OIDC); SLSA build provenance and SBOM
#     attestations for every binary.
#  3. Distroless images pushed to GHCR, signed, with provenance and SBOM attestations.
#  4. GitHub release with binaries, SBOMs, checksums and signature bundle.
# Deployment is a separate, approval-gated workflow (deploy.yml) with staged rollout.
# GitHub-hosted on purpose (D-0039, D-0045): the build signs with Sigstore and attests provenance,
# which must not come from the shared self-hosted runner host. Runs only when the owner pushes a
# version tag, inside the free monthly allowance; `cargo xtask workflows` allows hosted runners
# only here and in deploy.yml, and only on a pushed tag or a manual start.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  TARGET: x86_64-unknown-linux-gnu
  BUILDER: rust:1.99.1-trixie@sha256:8a4e90c7946b74626488b1446f712c0fe0ed1a596cbd3d871684bc9c5433ae07

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      id-token: write
      attestations: write
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: v
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - name: reproducible build (twice, compared) with SBOM
        run: |
          docker run --rm -e CI=1 -v "$PWD:/songbird" -w /songbird "$BUILDER" sh -euc '
            git config --global --add safe.directory /songbird
            cargo install --locked cargo-cyclonedx@0.5.10
            cargo xtask release --target "'"$TARGET"'" --verify'
          sudo chown -R "$(id -u):$(id -g)" target
      - name: version matches tag
        run: test -d "target/dist/${{ steps.v.outputs.version }}/$TARGET"
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: sign checksums (keyless)
        working-directory: target/dist/${{ steps.v.outputs.version }}/${{ env.TARGET }}
        run: cosign sign-blob --yes --bundle SHA256SUMS.sigstore.json SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: target/dist/${{ steps.v.outputs.version }}/${{ env.TARGET }}/SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: target/dist/${{ steps.v.outputs.version }}/${{ env.TARGET }}
          if-no-files-found: error

  images:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      matrix:
        bin: [songbird-delivery, songbird-api, songbird-push, songbird-worker, songbird-calls, songbird-proxy, songbird-admin]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: dist
          # songbird-admin carries the pinned age tool (backups, D-0040).
          file: ${{ matrix.bin == 'songbird-admin' && 'deploy/docker/admin.Dockerfile' || 'deploy/docker/runtime.Dockerfile' }}
          build-args: BIN=${{ matrix.bin }}
          push: true
          provenance: false
          sbom: false
          tags: ghcr.io/${{ github.repository_owner }}/${{ matrix.bin }}:${{ needs.build.outputs.version }}
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - run: cosign sign --yes "ghcr.io/${{ github.repository_owner }}/${{ matrix.bin }}@${{ steps.push.outputs.digest }}"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/${{ matrix.bin }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
      - uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/${{ matrix.bin }}
          subject-digest: ${{ steps.push.outputs.digest }}
          sbom-path: dist/${{ matrix.bin }}.cdx.json
          push-to-registry: true

  publish:
    needs: [build, images]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --notes "Verify: cosign verify-blob --bundle SHA256SUMS.sigstore.json --certificate-identity-regexp 'https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@.*' --certificate-oidc-issuer https://token.actions.githubusercontent.com SHA256SUMS && sha256sum -c SHA256SUMS"
