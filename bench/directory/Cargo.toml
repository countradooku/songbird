[package]
name = "songbird-bench-directory"
version = "0.0.0"
edition = "2024"
publish = false
description = "M3 choices: the device directory map (papaya, scc, dashmap, Mutex<HashMap>) and the cross-core inbox (tokio mpsc, kanal, crossbeam + Notify). Not part of the workspace."

# Standalone: its own lockfile, so candidates do not enter the workspace's vet and deny graph
# until one is chosen.
[workspace]

[dependencies]
papaya = "=0.2.5"
scc = "=3.8.8"
dashmap = "=6.2.1"
kanal = "=0.1.1"
crossbeam-channel = "=0.5.17"
tokio = { version = "1", features = ["rt", "sync", "time", "macros"] }
mimalloc = { version = "0.1", default-features = false }

[profile.release]
debug = 1
