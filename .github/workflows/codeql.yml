name: codeql

# Every pull request, every push to main, weekly, and on demand, on GitHub-hosted runners (D-0045).
# The job fails on any finding, as before (D-0015). Results are also uploaded to code scanning
# (the Security tab), which a public repository has for free; not from pull requests, whose token
# from a fork cannot write security events.
on:
  pull_request:
    paths-ignore: ["docs/**", "**/*.md"]
  push:
    branches: [main]
    paths-ignore: ["docs/**", "**/*.md"]
  schedule:
    - cron: "41 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      # codeql-action reads the workflow run to build the analysis key.
      actions: read
      contents: read
      # Upload to code scanning (D-0045). A fork's pull request gets this as read only.
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [rust, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended
      # The job gates on the SARIF itself and keeps it as an artifact (D-0015); outside pull
      # requests the results also go to code scanning (D-0045).
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: /language:${{ matrix.language }}
          upload: ${{ github.event_name == 'pull_request' && 'never' || 'always' }}
          output: sarif-results
      - name: Keep SARIF
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: codeql-sarif-${{ matrix.language }}
          path: sarif-results
          if-no-files-found: error
          retention-days: 30
      - name: Fail on findings
        env:
          LANGUAGE: ${{ matrix.language }}
        run: |
          set -euo pipefail
          sarif="sarif-results/${LANGUAGE}.sarif"
          # Owner-approved waiver (D-0015 amendment): published test vectors use fixed nonces by
          # design, so rust/hard-coded-cryptographic-value is skipped for files under a tests/
          # directory only. Every other rule, and this rule everywhere else, still fails the job.
          waived='(.ruleId == "rust/hard-coded-cryptographic-value" and ((.locations[0].physicalLocation.artifactLocation.uri // "") | test("(^|/)tests/")))'
          results=".runs[].results[]? | select($waived | not)"
          jq -r ".runs[].results[]? | select($waived)"' |
            "::notice file=\(.locations[0].physicalLocation.artifactLocation.uri // "?"),line=\(.locations[0].physicalLocation.region.startLine // 1)::waived (D-0015, tests/ only): \(.ruleId): \(.message.text)"' "$sarif"
          count=$(jq "[$results] | length" "$sarif")
          if [ "$count" -ne 0 ]; then
            jq -r "$results"' |
              "::error file=\(.locations[0].physicalLocation.artifactLocation.uri // "?"),line=\(.locations[0].physicalLocation.region.startLine // 1)::\(.ruleId): \(.message.text)"' "$sarif"
            echo "CodeQL reported $count finding(s) for $LANGUAGE." >&2
            exit 1
          fi
          echo "CodeQL: no findings for $LANGUAGE."
