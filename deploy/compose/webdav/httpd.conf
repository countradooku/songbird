# WebDAV for the backup adapter's conformance tests (Prompt 10, D-0122), development and CI only:
# Apache httpd's mod_dav, the reference WebDAV server (RFC 4918), with strong ETags and the
# conditional requests (If-Match, If-None-Match) the adapter's compare-and-swap relies on.
ServerRoot "/usr/local/apache2"
Listen 8080
ServerName webdav.songbird.test
LoadModule mpm_event_module modules/mod_mpm_event.so
LoadModule unixd_module modules/mod_unixd.so
LoadModule authn_core_module modules/mod_authn_core.so
LoadModule authn_file_module modules/mod_authn_file.so
LoadModule authz_core_module modules/mod_authz_core.so
LoadModule authz_user_module modules/mod_authz_user.so
LoadModule auth_basic_module modules/mod_auth_basic.so
LoadModule dav_module modules/mod_dav.so
LoadModule dav_fs_module modules/mod_dav_fs.so
LoadModule mime_module modules/mod_mime.so
User daemon
Group daemon
ErrorLog /proc/self/fd/2
LogLevel warn
# Whole objects at most 64 MiB (a chunk object is at most 8.25 MiB).
LimitRequestBody 67108864
FileETag MTime Size INode
DavLockDB /usr/local/apache2/var/DavLock
DocumentRoot "/usr/local/apache2/dav"
<Directory />
    AllowOverride None
    Require all denied
</Directory>
<Directory "/usr/local/apache2/dav">
    Dav On
    AuthType Basic
    AuthName "songbird-webdav-test"
    AuthBasicProvider file
    AuthUserFile /usr/local/apache2/conf/htpasswd
    Require valid-user
</Directory>
