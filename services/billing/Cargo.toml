[package]
name = "songbird-billing"
description = "Songbird billing (Prompt 11, D-0129): App Store, Google Play and Mollie verified server-side, subscriptions in a database of their own under keyed hashes, anonymous plan tokens issued under per-month caps. Never sees an account."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "songbird-billing"
path = "src/main.rs"

[dependencies]
songbird-service.workspace = true
songbird-types.workspace = true
songbird-accounts.workspace = true
songbird-surreal.workspace = true
songbird-tokens.workspace = true
aws-lc-rs.workspace = true
bytes.workspace = true
hex.workspace = true
http-body-util.workspace = true
hyper = { workspace = true, features = ["client", "server", "http1"] }
hyper-util = { workspace = true, features = ["server", "http1", "tokio"] }
mimalloc.workspace = true
rustls.workspace = true
rustls-pki-types.workspace = true
# Apple's x5c chains (D-0129): rustls-webpki, already in the tree under rustls, verifies
# certificates from the network; no other X.509 parser touches them.
webpki = { package = "rustls-webpki", version = "=0.103.16", default-features = false, features = ["std", "aws-lc-rs"] }
webpki-roots.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
getrandom.workspace = true
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "net", "macros", "time", "sync", "io-util"] }
tokio-rustls.workspace = true
tracing.workspace = true
zeroize.workspace = true

[dev-dependencies]
rcgen.workspace = true
songbird-types.workspace = true

[lints]
workspace = true
