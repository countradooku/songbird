[package]
name = "songbird-push-providers"
description = "Push provider clients (APNs, FCM HTTP v1, Web Push for UnifiedPush) that send one identical, contentless wake-up, with a circuit breaker per provider; mock providers for tests (D-0036)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[features]
# Mock APNs, FCM (with its OAuth token endpoint) and Web Push servers, for this crate's tests and
# the push service's.
test-support = ["dep:rcgen", "hyper/server", "tokio/macros"]

[dependencies]
aws-lc-rs.workspace = true
bytes.workspace = true
hex.workspace = true
http-body-util.workspace = true
# HTTP/2 client connections for APNs and FCM (adds `h2`), HTTP/1.1 for Web Push endpoints.
hyper = { workspace = true, features = ["client", "http1", "http2"] }
hyper-util.workspace = true
rustls.workspace = true
rustls-pki-types.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt", "net", "time", "sync"] }
tokio-rustls.workspace = true
tracing.workspace = true
webpki-roots.workspace = true
zeroize.workspace = true
rcgen = { workspace = true, optional = true }

[dev-dependencies]
# The integration tests use the mocks.
songbird-push-providers = { path = ".", features = ["test-support"] }
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "net", "time", "sync", "macros", "test-util"] }

[lints]
workspace = true
