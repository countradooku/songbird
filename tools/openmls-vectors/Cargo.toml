# Prints MLS KeyPackages made by OpenMLS for Songbird's own KeyPackage checks (D-0051). NOT part
# of the workspace or of any build: the owner chose not to run OpenMLS on the server; this tool
# only proves the server's parser against the reference library. Run by hand (README.md).
[package]
name = "openmls-vectors"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
openmls = "=0.9.2"
openmls_rust_crypto = "=0.6.0"
openmls_basic_credential = "=0.6.0"
tls_codec = "0.5"
hex = "0.4"

[workspace]
