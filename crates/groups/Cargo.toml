[package]
name = "songbird-groups"
description = "Songbird's MLS delivery service (Prompt 5, D-0065): OpenMLS PublicGroup validation behind Songbird's verify-only aws-lc-rs provider, roles and the roster projection."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
aws-lc-rs.workspace = true
# OpenMLS core only, no crypto backend (D-0065 §1); the PQ feature names the X-Wing suites.
openmls = { version = "=0.9.2", default-features = false, features = ["draft-ietf-mls-pq-ciphersuites"] }
openmls_traits = { version = "=0.6.0", features = ["draft-ietf-mls-pq-ciphersuites"] }
serde.workspace = true
postcard.workspace = true
songbird-keys.workspace = true
songbird-proto.workspace = true
songbird-types.workspace = true
thiserror.workspace = true
tls_codec = "0.5"

[dev-dependencies]
hex.workspace = true

[lints]
workspace = true
