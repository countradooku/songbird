name: Decision record
description: Propose or record a decision for docs/DECISIONS.md (X versus Y, new dependency, unsafe exception, owner decision).
title: "[Decision] "
labels: ["owner-decision"]
body:
  - type: textarea
    id: context
    attributes:
      label: Context
      description: What forces the decision.
    validations:
      required: true
  - type: textarea
    id: options
    attributes:
      label: Options considered
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Benchmark runs (hardware, kernel, configuration, numbers), tests, proofs.
  - type: textarea
    id: proposal
    attributes:
      label: Proposed decision
    validations:
      required: true
  - type: textarea
    id: consequences
    attributes:
      label: Consequences
      description: What this rules in or out, and when to revisit.
