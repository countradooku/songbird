# Fast checks: pull requests and pushes to main. Must stay under ~15 minutes.
# Deep checks (sanitizers, long fuzzing, full benchmarks) run nightly: nightly.yml. So do
# CodeQL (codeql.yml) and the container images (images.yml), off the pull request path (D-0045).
# Every action is pinned to a full commit SHA; the tag is in the trailing comment.
name: ci

# Self-hosted runners only (D-0039, D-0045): `songbird` for everything, `songbird-stack` (one
# runner) for jobs that start the compose stack or bind fixed ports. No job here may run on a
# GitHub-hosted runner; `cargo xtask workflows` (part of `cargo xtask ci fast`) enforces it.
# Every job carries the same-repository guard: code from a fork never runs on these runners.
on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "**/*.md"]
  pull_request:
    # A docs-only change builds nothing.
    paths-ignore: ["docs/**", "**/*.md"]
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request cancels its older run; every commit on main is checked to the end.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"

jobs:
  checks:
    name: quality bar (cargo xtask ci fast)
    runs-on: [self-hosted, songbird]
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: toolchain (from rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # Pull requests restore main's cache but never save their own (D-0045): per-branch
          # caches (about 0.8 GB each) went past the free 10 GB of Actions cache.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-nextest@0.9.151,cargo-deny@0.20.2,cargo-audit@0.22.2,cargo-vet@0.10.2
      - run: cargo xtask ci fast
      # Artifacts only when something failed (D-0045): they count against the 500 MB of free
      # Actions storage.
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: junit
          path: target/nextest/ci/junit.xml
          if-no-files-found: ignore
          retention-days: 14

  compose:
    name: integration environment (docker compose)
    runs-on: [self-hosted, songbird-stack]
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # Pull requests restore main's cache but never save their own (D-0045): per-branch
          # caches went past the free 10 GB of Actions cache.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: start SurrealDB, Iggy, valkey-hot, valkey-jobs, RustFS, LiveKit and wait for health
        run: cargo xtask compose up
      - run: cargo xtask compose ps
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-nextest@0.9.151
      - name: age 1.3.2 for the backup tests (pinned like deploy/bin/install-tools)
        run: |
          curl -fsSL --proto '=https' --tlsv1.2 -o "$RUNNER_TEMP/age.tgz" \
            https://github.com/FiloSottile/age/releases/download/v1.3.2/age-v1.3.2-linux-amd64.tar.gz
          echo "cbe24006683f8eb669266162894b9a522a1af52f2665fbc63a4bb032ed26ac10  $RUNNER_TEMP/age.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/age.tgz" -C "$RUNNER_TEMP" age/age age/age-keygen
      - name: invariants on Iggy; mailbox on Iggy and SurrealDB; cluster mode and routing on Valkey; SurrealDB RPC client; S3 client on RustFS; M5 jobs, registry, api, push and gate (no skipping)
        run: |
          set -a; . ./.env; set +a
          export SONGBIRD_TEST_SURREALDB="127.0.0.1:${SB_PORT_SURREALDB:-47800}"
          export SONGBIRD_TEST_SURREALDB_USER="$SURREAL_USER"
          export SONGBIRD_TEST_SURREALDB_PASS="$SURREAL_PASS"
          export SONGBIRD_REQUIRE_SURREALDB=1
          export SONGBIRD_TEST_IGGY="127.0.0.1:${SB_PORT_IGGY:-47890}"
          export SONGBIRD_TEST_IGGY_USER="$IGGY_ROOT_USERNAME"
          export SONGBIRD_TEST_IGGY_PASS="$IGGY_ROOT_PASSWORD"
          export SONGBIRD_REQUIRE_IGGY=1
          # Routing and cluster leases use a Valkey without persistence: valkey-hot.
          export SONGBIRD_TEST_VALKEY="redis://:${VALKEY_HOT_PASSWORD}@127.0.0.1:${SB_PORT_VALKEY_HOT:-47379}/"
          export SONGBIRD_REQUIRE_VALKEY=1
          export SONGBIRD_TEST_RUSTFS="127.0.0.1:${SB_PORT_RUSTFS:-47900}"
          export SONGBIRD_TEST_RUSTFS_ACCESS_KEY="$RUSTFS_ACCESS_KEY"
          export SONGBIRD_TEST_RUSTFS_SECRET_KEY="$RUSTFS_SECRET_KEY"
          export SONGBIRD_REQUIRE_RUSTFS=1
          # Jobs (M5) on valkey-jobs (persistent); the whole stack for api and the M5 gate.
          export SONGBIRD_TEST_VALKEY_JOBS="redis://:${VALKEY_JOBS_PASSWORD}@127.0.0.1:${SB_PORT_VALKEY_JOBS:-47380}/"
          export SONGBIRD_REQUIRE_STACK=1
          # Backups (M6): restore against tampering on RustFS and SurrealDB with the age tool.
          export SONGBIRD_TEST_AGE="$RUNNER_TEMP/age"
          cargo nextest run --locked --profile ci -p songbird-surreal -p songbird-mailbox -p songbird-router -p songbird-s3 -p songbird-e2e -p songbird-accounts -p songbird-admin
          # These share the job streams (one consumer group; some wipe them): one crate at a
          # time, one test at a time.
          cargo nextest run --locked --profile ci -p songbird-api -j 1
          cargo nextest run --locked --profile ci -p songbird-jobs -j 1
          cargo nextest run --locked --profile ci -p songbird-push -j 1
      - if: failure()
        run: docker compose -f deploy/compose/compose.yaml --env-file .env logs --no-color
      - if: always()
        run: cargo xtask compose down

  autobahn:
    name: WebSocket conformance (Autobahn)
    runs-on: [self-hosted, songbird-stack]
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # Pull requests restore main's cache but never save their own (D-0045): per-branch
          # caches went past the free 10 GB of Actions cache.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Autobahn fuzzingclient against the delivery WebSocket layer (image pinned by digest)
        run: cargo xtask autobahn
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: autobahn-reports
          path: target/autobahn
          if-no-files-found: ignore
          retention-days: 14

  semgrep:
    name: semgrep
    runs-on: [self-hosted, songbird]
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    timeout-minutes: 15
    container:
      image: semgrep/semgrep:1.185.0@sha256:67518c174185a2043fdbed16c70631b79209499b3671178e7194379b48295a0d
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Registry rules are downloaded; no code or metrics leave the runner.
      - run: semgrep scan --metrics=off --error --config p/rust --config p/secrets --config .semgrep/

  iac:
    name: infrastructure as code (tofu, ansible)
    runs-on: [self-hosted, songbird]
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: 1.13.9
          tofu_wrapper: false
      - name: tofu fmt and validate (both providers)
        run: deploy/bin/validate-iac tofu
      - name: ansible syntax and lint
        run: |
          python3 -m venv /tmp/ansible && . /tmp/ansible/bin/activate
          pip install --require-hashes -r deploy/ansible/requirements.txt
          deploy/bin/validate-iac ansible
