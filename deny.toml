# cargo-deny: advisories, licences, bans and sources. Run by `cargo xtask ci`.
[graph]
all-features = false

[advisories]
# Every advisory fails the build unless listed here with a reason and an expiry review date.
ignore = []
unmaintained = "workspace"
yanked = "deny"

[licenses]
# Permissive licences only. Adding one requires a DECISIONS.md entry.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "ISC",
    "MIT",
    "Unicode-3.0",
]
confidence-threshold = 0.93
# Per-crate exceptions, each recorded in docs/DECISIONS.md (D-0030: Iggy SDK dependencies;
# D-0034: the Valkey client).
exceptions = [
    { allow = ["Zlib"], crate = "foldhash" },
    { allow = ["CDLA-Permissive-2.0"], crate = "webpki-roots" },
    { allow = ["CDLA-Permissive-2.0"], crate = "webpki-root-certs" },
    { allow = ["BSL-1.0"], crate = "xxhash-rust" },
]

[licenses.private]
# Songbird's own crates are unpublished (publish = false); their licence is chosen later.
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
highlight = "all"
deny = [
    # Locked stack: rustls with aws-lc-rs. No OpenSSL bindings, no ring-only TLS paths.
    { name = "openssl", reason = "locked stack uses rustls + aws-lc-rs" },
    { name = "openssl-sys", reason = "locked stack uses rustls + aws-lc-rs" },
    { name = "native-tls", reason = "locked stack uses rustls + aws-lc-rs" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
