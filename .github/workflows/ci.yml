# Fast checks: every push and pull request. Must stay under ~15 minutes.
# Deep checks (sanitizers, long fuzzing, full benchmarks) run nightly: nightly.yml.
# Every action is pinned to a full commit SHA; the tag is in the trailing comment.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"

jobs:
  checks:
    name: quality bar (cargo xtask ci fast)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: toolchain (from rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-nextest@0.9.151,cargo-deny@0.20.2,cargo-audit@0.22.2,cargo-vet@0.10.2
      - run: cargo xtask ci fast
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: junit
          path: target/nextest/ci/junit.xml
          if-no-files-found: ignore

  compose:
    name: integration environment (docker compose)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: start SurrealDB, valkey-hot, valkey-jobs, Garage, LiveKit and wait for health
        run: cargo xtask compose up
      - run: cargo xtask compose ps
      - if: failure()
        run: docker compose -f deploy/compose/compose.yaml --env-file .env logs --no-color
      - if: always()
        run: cargo xtask compose down

  images:
    name: container image (${{ matrix.bin }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        bin: [songbird-delivery, songbird-api, songbird-push, songbird-worker, songbird-calls, songbird-proxy]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/docker/Dockerfile
          build-args: BIN=${{ matrix.bin }}
          push: false
          load: true
          tags: ${{ matrix.bin }}:ci
          cache-from: type=gha,scope=${{ matrix.bin }}
          cache-to: type=gha,mode=max,scope=${{ matrix.bin }}
      - name: image starts and runs as non-root
        run: |
          test "$(docker image inspect ${{ matrix.bin }}:ci --format '{{.Config.User}}')" = "nonroot:nonroot"
          docker run --rm ${{ matrix.bin }}:ci --version

  semgrep:
    name: semgrep
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container:
      image: semgrep/semgrep:1.185.0@sha256:67518c174185a2043fdbed16c70631b79209499b3671178e7194379b48295a0d
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Registry rules are downloaded; no code or metrics leave the runner.
      - run: semgrep scan --metrics=off --error --config p/rust --config p/secrets --config .semgrep/

  iac:
    name: infrastructure as code (tofu, ansible)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: 1.13.9
          tofu_wrapper: false
      - name: tofu fmt and validate (both providers)
        run: deploy/bin/validate-iac tofu
      - name: ansible syntax and lint
        run: |
          python3 -m venv /tmp/ansible && . /tmp/ansible/bin/activate
          pip install --require-hashes -r deploy/ansible/requirements.txt
          deploy/bin/validate-iac ansible
