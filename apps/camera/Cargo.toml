[package]
name = "songbird-camera"
version = "0.1.0"
edition = "2024"
publish = false
description = "Songbird's camera: one interface over AVFoundation, CameraX, Media Foundation and PipeWire (D-0110)"

# Its own workspace, as apps/ui: the app's crates are outside the server workspace.
[workspace]

[dependencies]
# On-device QR decoding where the OS has none (Android, Windows, Linux) and as
# the fallback on Apple (D-0110). No `img`: frames come as grey bytes.
rqrr = { version = "0.11.0", default-features = false }

[lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
# Framework names (AVFoundation, CameraX) are words in these docs, not code.
doc_markdown = "allow"

# macOS and iOS: AVFoundation from Rust (D-0110, M2), the same objc2 family and versions as
# NSH's platform crates; serde_json for the preview component's props.
[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
objc2 = "0.6.5"
block2 = "0.6.2"
dispatch2 = "0.3.1"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSArray", "NSData", "NSDate", "NSDictionary", "NSError", "NSRunLoop", "NSString", "NSValue", "NSObject", "NSGeometry", "objc2-core-foundation"] }
objc2-av-foundation = { version = "0.3.2", default-features = false, features = ["std", "block2", "dispatch2", "objc2-core-media", "objc2-core-video", "objc2-quartz-core", "AVAnimation", "AVCaptureDevice", "AVCaptureInput", "AVCaptureMetadataOutput", "AVCaptureOutputBase", "AVCapturePhotoOutput", "AVCaptureSession", "AVCaptureSessionPreset", "AVCaptureVideoDataOutput", "AVCaptureVideoPreviewLayer", "AVMediaFormat", "AVMetadataObject", "AVVideoSettings"] }
objc2-core-media = { version = "0.3.2", default-features = false, features = ["std", "CMBase", "CMSampleBuffer", "CMTime", "objc2-core-video"] }
objc2-core-video = { version = "0.3.2", default-features = false, features = ["std", "CVBase", "CVBuffer", "CVImageBuffer", "CVPixelBuffer", "CVReturn"] }
serde_json = "1"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSResponder", "NSView"] }
nsh-platform-macos = { version = "0.6.0", default-features = false }

[target.'cfg(target_os = "ios")'.dependencies]
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["std", "CFCGTypes"] }
objc2-ui-kit = { version = "0.3.2", default-features = false, features = ["std", "UIResponder", "UIView", "objc2-quartz-core"] }
nsh-platform-ios = { version = "0.6.0", default-features = false }

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dev-dependencies]
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSDate", "NSRunLoop"] }
