# LiveKit, single node, development and CI only. API key and secret come from LIVEKIT_KEYS.
# As deployed (deploy/ansible/roles/calls/templates/livekit.yaml.j2) rooms exist only as `api`
# creates them (D-0088); webhooks need a `calls` service, which compose does not run.
port: 7880
bind_addresses: ["0.0.0.0"]
rtc:
  tcp_port: 7881
  udp_port: 7882
  use_external_ip: false
logging:
  json: true
  level: info
room:
  auto_create: false
  empty_timeout: 180
  departure_timeout: 20
