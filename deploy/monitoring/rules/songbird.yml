# Songbird alert rules (Prompt 8, D-0097). Tested in CI with `promtool test rules`
# (deploy/monitoring/tests/songbird.test.yml). Metrics carry no identifiers (invariant 6): every
# alert is about the service, never about a device or account. Each names its runbook.
groups:
  - name: songbird-push
    rules:
      - alert: JobsDeadLettered
        expr: increase(songbird_jobs_dead_lettered_total[15m]) > 0
        labels:
          severity: page
        annotations:
          summary: "{{ $labels.instance }}: jobs went to the dead-letter stream"
          runbook: docs/RUNBOOKS/jobs-push-api-worker.md#dead-letters-jdead-growing-any-stream

      - alert: PushProviderDown
        # Retries and no successes for 10 minutes: the provider is failing and its breaker is
        # open or opening. Messages are safe in the mailboxes; wake-ups resume on recovery.
        expr: >
          sum by (instance, provider) (rate(songbird_push_results_total{result="retried"}[5m])) > 0
          and
          sum by (instance, provider) (rate(songbird_push_results_total{result="sent"}[5m])) == 0
        for: 10m
        labels:
          severity: page
        annotations:
          summary: "{{ $labels.provider }} has been failing for 10 minutes"
          runbook: docs/RUNBOOKS/jobs-push-api-worker.md#push-provider-outage-or-rate-limiting

      - alert: PushPermanentFailures
        # Not about tokens: bad credentials, a rejected request. Retrying will not help.
        expr: sum by (instance, provider) (increase(songbird_push_results_total{result="failed"}[15m])) > 0
        labels:
          severity: page
        annotations:
          summary: "{{ $labels.provider }} refuses pushes (credentials or request)"
          runbook: docs/RUNBOOKS/jobs-push-api-worker.md#push-provider-outage-or-rate-limiting

      - alert: PushRingsTooLate
        expr: increase(songbird_push_rings_expired_total[15m]) > 5
        labels:
          severity: warn
        annotations:
          summary: "call rings dropped because they could no longer ring in time"
          runbook: docs/RUNBOOKS/jobs-push-api-worker.md#call-rings-too-late

      - alert: PushRegistrationsUnopenable
        # The push key does not open registrations: a wrong or rotated key.
        expr: increase(songbird_push_registrations_unopenable_total[15m]) > 0
        labels:
          severity: page
        annotations:
          summary: "push registrations do not open with this push key"
          runbook: docs/RUNBOOKS/jobs-push-api-worker.md#dead-letters-jdead-growing-any-stream

      - alert: WakeUpsDropped
        # delivery could not queue wake-ups (job queue unreachable or buffer full).
        expr: increase(songbird_delivery_push_dropped_total[5m]) > 0
        labels:
          severity: warn
        annotations:
          summary: "{{ $labels.instance }}: wake-ups dropped; messages are safe in the mailbox"
          runbook: docs/RUNBOOKS/jobs-push-api-worker.md#push-jobs-dropped-delivery_push_dropped-rising

  - name: songbird-services
    rules:
      - alert: RegistryBusy
        expr: increase(songbird_registry_busy_total[10m]) > 10
        labels:
          severity: warn
        annotations:
          summary: "{{ $labels.instance }}: registry write conflicts outlast the retry budget"
          runbook: docs/RUNBOOKS/jobs-push-api-worker.md#registry-busy-write-conflicts-outlasting-the-retry-budget-d-0093

      - alert: ServiceDown
        expr: up{job="songbird"} == 0
        for: 2m
        labels:
          severity: page
        annotations:
          summary: "{{ $labels.instance }} is not answering its metrics endpoint"
          runbook: docs/RUNBOOKS/deploy-and-rollback.md
