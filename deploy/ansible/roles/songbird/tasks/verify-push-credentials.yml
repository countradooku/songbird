---
# After every rollout, on every Songbird host (D-0097, D-0100): no container but songbird-push
# mounts the push secrets (or any folder above them), no container's environment names a push
# credential, and the files are the push uid's alone. Fails the rollout otherwise.
#
# Only each container's name, mount sources and environment variable *names* leave the host:
# `docker inspect`'s template cuts every variable at `=`, so no value (LiveKit's keys, Valkey
# passwords) reaches the controller or its logs.
- name: Containers on this host
  ansible.builtin.command: docker ps --all --quiet --no-trunc
  register: containers
  changed_when: false

- name: Their names, mount sources and environment variable names (never values)
  ansible.builtin.command:
    argv: "{{ ['docker', 'inspect', '--format', inspect_format] + containers.stdout_lines }}"
  vars:
    # One JSON line per container; spaces between the parts are only JSON whitespace.
    inspect_format: >-
      {% raw %}{"name":{{json .Name}},
      "mounts":[{{range $i, $m := .Mounts}}{{if $i}},{{end}}{{json $m.Source}}{{end}}],
      "env":[{{range $i, $e := .Config.Env}}{{if $i}},{{end}}{{json (index (split $e "=") 0)}}{{end}}]}{% endraw %}
  register: inspected
  changed_when: false
  no_log: true
  when: containers.stdout_lines | length > 0

- name: Only songbird-push reaches the push secrets; no environment names a push credential
  ansible.builtin.assert:
    that:
      # A mount of the folder, anything inside it, or any folder above it (/, /etc, …).
      - >-
        (item.name | regex_replace('^/', '')) == 'songbird-push'
        or (item.mounts
            | select('match', '^(/|/etc|/etc/songbird|/etc/songbird/secrets|/etc/songbird/secrets/push)/?$|^/etc/songbird/secrets/push/')
            | list | length) == 0
      - >-
        (item.env | map('upper') | select('search', 'APNS|FCM|VAPID|PUSH_KEY') | list | length) == 0
    fail_msg: "{{ item.name }}: a push credential can reach this container"
    quiet: true
  loop: "{{ inspected.stdout_lines | default([]) | map('from_json') | list }}"
  loop_control:
    label: "{{ item.name }}"

- name: Push secret files
  ansible.builtin.find:
    paths: /etc/songbird/secrets/push
    file_type: file
  register: push_files
  when: "'push' in songbird_services"

- name: Push secret files are mode 0400 and owned by the push uid
  ansible.builtin.assert:
    that:
      - item.mode == '0400'
      - item.uid == push_uid
    quiet: true
  loop: "{{ push_files.files | default([]) }}"
  loop_control:
    label: "{{ item.path | basename }}"
