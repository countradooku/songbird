---
# After every rollout, on every Songbird host (D-0097): the push secrets directory is mounted into
# songbird-push and into no other container, no container's environment names a push credential,
# and the files are the push uid's alone. Fails the rollout otherwise.
- name: Containers on this host
  ansible.builtin.command: docker ps --all --quiet --no-trunc
  register: containers
  changed_when: false

- name: Their configuration
  ansible.builtin.command:
    argv: "{{ ['docker', 'inspect'] + containers.stdout_lines }}"
  register: inspected
  changed_when: false
  when: containers.stdout_lines | length > 0

- name: Only songbird-push mounts the push secrets; no environment names a push credential
  ansible.builtin.assert:
    that:
      - >-
        item.Name == '/songbird-push'
        or (item.Mounts | map(attribute='Source') | select('match', '^/etc/songbird/secrets/push') | list | length) == 0
      - >-
        (item.Config.Env | default([], true) | map('regex_replace', '=.*$', '') | map('upper')
         | select('search', 'APNS|FCM|VAPID|PUSH_KEY') | list | length) == 0
    fail_msg: "a push credential reaches a container other than songbird-push"
    quiet: true
  loop: "{{ (inspected.stdout | default('[]', true)) | from_json }}"
  loop_control:
    label: "{{ item.Name }}"

- name: Push secret files
  ansible.builtin.find:
    paths: /etc/songbird/secrets/push
    file_type: file
  register: push_files
  when: "'push' in songbird_services"

- name: Push secret files are mode 0400 and owned by the push uid
  ansible.builtin.assert:
    that:
      - item.mode == '0400'
      - item.uid == 65532
    quiet: true
  loop: "{{ push_files.files | default([]) }}"
  loop_control:
    label: "{{ item.path | basename }}"
