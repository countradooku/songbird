[package]
name = "songbird-backup-storage"
description = "Where Songbird backups live (Prompt 10, D-0119, D-0121): one small BackupStore interface (put, get, list, delete, a compare-and-swap for the manifest) with adapters for the Songbird vault, S3, WebDAV, the Google Drive, OneDrive and Dropbox app folders, a local folder or file, and device-to-device transfer; the backup and restore runs over any of them; and one conformance suite every adapter passes. Runs on the device only: OAuth tokens and the recovery key never reach Songbird."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
songbird-backup-format.workspace = true
songbird-proto.workspace = true
async-trait.workspace = true
bytes.workspace = true
futures-util.workspace = true
getrandom.workspace = true
hex.workspace = true
http-body-util.workspace = true
hyper = { workspace = true, features = ["client"] }
hyper-util.workspace = true
rustls.workspace = true
rustls-pki-types.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["net", "rt", "sync", "time", "macros", "fs", "io-util"] }
tokio-rustls.workspace = true
webpki-roots.workspace = true
zeroize.workspace = true

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["net", "rt", "rt-multi-thread", "sync", "time", "macros", "fs", "io-util"] }

