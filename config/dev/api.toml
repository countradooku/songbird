# Development configuration for the api service. No secrets here, ever: secrets are
# referenced as { file = "..." } or { env = "..." } (see crates/types/src/secret.rs).
[common]
environment = "dev"
admin_listen = "127.0.0.1:9102"
shutdown_grace_secs = 5

[common.log]
format = "pretty"
filter = "info"

# Without [api] the service idles (development smoke test). To serve against the docker compose
# stores, uncomment and point the secrets at files you create (mode 0600):
#
# [api]
# listen = "127.0.0.1:8443"
# server_name = "api.localhost"
# push_public_key = "<64 hex: the push service's X25519 public key>"
# push_index_secret = { file = "/path/to/push-index-secret.hex" } # shared with push and worker
# [api.surrealdb]
# addr = "127.0.0.1:47800"
# host = "localhost"
# user = "root"
# pass = { env = "SURREAL_PASS" }
# [api.valkey_hot]
# addr = "127.0.0.1:47379"
# pass = { env = "VALKEY_HOT_PASSWORD" }
# [api.jobs]
# secret = { file = "/path/to/jobs-secret.hex" }                  # shared with delivery, push, worker
# [api.jobs.valkey]
# addr = "127.0.0.1:47380"
# pass = { env = "VALKEY_JOBS_PASSWORD" }
# [api.s3]
# addr = "127.0.0.1:47900"
# bucket = "songbird-attachments"
# access_key = { env = "RUSTFS_ACCESS_KEY" }
# secret_key = { env = "RUSTFS_SECRET_KEY" }
#
# PUT /v1/messages (D-0037, D-0044): needs the delivery nodes in cluster mode with
# `senders = ["api."]` in [delivery.cluster]; the values marked "as delivery" must match theirs.
# [api.send]
# stream = "songbird"                                            # as delivery's mailbox.iggy.stream
# topic = "mailbox"                                              # as delivery's mailbox.iggy.topic
# partitions = 12                                                # as delivery's mailbox.iggy.partitions
# idempotency_secret = { file = "/path/to/idempotency-secret.hex" } # as delivery's mailbox.iggy
# cluster_secret = { file = "/path/to/cluster-secret.hex" }      # as delivery's router.valkey
# node_name = "api.local.songbird.internal"                      # this service's link certificate
# cert_chain = "/path/to/api.crt"
# key = { file = "/path/to/api.key" }
# ca = "/path/to/ca.crt"
# [api.send.valkey]                                              # the router's Valkey (leases too)
# addr = "127.0.0.1:47379"
# pass = { env = "VALKEY_HOT_PASSWORD" }
#
# Registration and invites (Prompt 3, D-0048). Absent: those endpoints answer 503 and accounts are
# created only through the admin link. Every api node needs the same secret.
# [api.registration]
# secret = { file = "/path/to/registration-secret.hex" }         # 64 hex; same on every api node
# invite_only = true                                             # the launch default (D-0038)
# allowance = 5                                                  # invites per new account
# [api.registration.pow]                                         # measured defaults (D-0048)
# memory_kib = 16384
# iterations = 1
# bits = 4
# solutions = 8
#
# Usernames (Prompt 3, M2, D-0049). Absent: those endpoints answer 503.
# [api.usernames]
# secret = { file = "/path/to/usernames-secret.hex" }            # 64 hex; same on every api node
# reserved = ["songbird_ops"]                                     # beyond the built-in list
#
# The key directory (Prompt 3, M3, D-0050). Absent: those endpoints answer 503.
# [api.keys]
# secret = { file = "/path/to/keys-secret.hex" }                  # 64 hex; same on every api node
# system_key = { file = "/path/to/system-key-seed.hex" }          # optional; "prekeys low" notices, with [api.send]
# Profiles and sealed sender (Prompt 3, M5, D-0054). Absent: those endpoints answer 503.
# [api.profiles]
# secret = { file = "/path/to/profiles-secret.hex" }             # 64 hex; same on every api node
# certificate_key = { file = "/path/to/certificate-seed.hex" }   # with sealed_sender
# sealed_sender = false                                           # the flag; Prompt 12 verifies it
#
# The account record store: synced settings, contacts, lists (Prompt 9, M1, D-0102). Absent:
# those endpoints answer 503.
# [api.storage]
# secret = { file = "/path/to/storage-secret.hex" }              # 64 hex; same on every api node
# max_records = 10000                                             # per account
# max_bytes = 16777216                                            # per account, ciphertext
# max_objects = 16                                                # custom wallpapers, 2 MiB each
# writes_per_hour = 3600
# write_burst = 120
# record_units_per_hour = 60000                                   # records deleted + inserted
# record_units_burst = 40000                                      # at least 2 × max_records
# reads_per_hour = 7200
# read_burst = 240
#
# Key transparency on akd (Prompt 3, D-0057). Absent: those endpoints answer 503.
# [api.kt]
# secret = { file = "/path/to/kt-secret.hex" }                    # 64 hex; same on every api node
# log_key = { file = "/path/to/kt-log-seed.hex" }                 # signs epoch heads; apps pin it
# vrf_key = { file = "/path/to/kt-vrf-seed.hex" }                 # the worker's kt_vrf_key (akd, D-0057)
#
# [api.keys.devices]                                             # device linking (Prompt 3, M4, D-0052); defaults
# max_devices = 6                                                 # primary + 5 (D-0047)
# link_token_ttl_secs = 600
# channel_ttl_secs = 600
# long_poll_secs = 25
#
# [api.attachments]                                              # defaults (D-0079, D-0081)
# max_bytes = 2147483648                                          # 2 GiB, a length the format produces
# part_size = 16777216                                            # resumable parts of 16 MiB
# [api.media]                                                     # Prompt 6; absent: no upload budgets (development only)
# secret = { file = "/path/to/media-secret.hex" }                 # 64 hex; same on every api node
# [api.media.budgets]                                             # per account; defaults
# grants_per_hour = 300
# grant_burst = 60
# bytes_per_day = 10737418240                                     # 10 GiB
# [api.media.downloads]                                           # Prompt 6, M3; defaults
# url_ttl_secs = 600                                              # signed media URLs
# per_hour = 6000                                                 # redirects and confirmations per IP range
# burst = 600
# ipv4_prefix = 24
# ipv6_prefix = 48
# [api.media.gifs]                                                # Prompt 6, M4 (GIPHY, D-0079); absent: GIF endpoints 503
# api_key = { file = "/path/to/giphy-key" }                       # the owner's GIPHY key; never in the repository
# rating = "pg-13"
# searches_per_hour = 300                                         # per account
# search_burst = 60
# provider_per_sec = 50                                           # across the cluster
# [api.calls]                                                     # Prompt 7 (D-0085); absent: /v1/calls… 503
# secret = { file = "/path/to/calls-secret.hex" }                 # 64 hex; same on every api and calls node
# livekit_url = "ws://127.0.0.1:47880"                            # what apps connect to (wss:// when deployed)
# api_url = "http://127.0.0.1:47880"                              # LiveKit's Twirp API (https:// + [api.calls.tls] when deployed)
# api_key = "devXXXXXXXX"                                         # LIVEKIT_API_KEY from .env
# api_secret = { env = "LIVEKIT_API_SECRET" }
# [api.calls.limits]                                              # defaults (D-0085 §3)
# video_participants = 32
# audio_participants = 128
# token_ttl_secs = 120
